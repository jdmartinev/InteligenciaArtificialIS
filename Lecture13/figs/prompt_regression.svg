<svg width="1100" height="650" viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .hand { font-family: "Comic Sans MS", "Segoe Print", "Marker Felt", cursive; }
    .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
    .line { stroke:#111; stroke-width:2.2; fill:none; marker-end:url(#arrow); stroke-linecap:round; }
    .thin { stroke:#111; stroke-width:1.8; fill:none; stroke-linecap:round; }
    .prompt { font-size:25px; fill:#111; }
    .small { font-size:21px; fill:#111; }
    .title1 { font-size:31px; font-weight:400; fill:#111; }
    .title2 { font-size:42px; font-weight:800; fill:#000; }
  </style>

  <!-- User / engineer -->
  <g transform="translate(80 150)">
    <!-- head -->
    <circle cx="68" cy="42" r="31" fill="#FFD76A" stroke="#D8A423" stroke-width="2"/>
    <!-- hair -->
    <path d="M39 37 C41 13, 61 8, 77 13 C97 19, 105 40, 91 58 C90 40, 82 30, 66 28 C55 29, 47 33, 39 37Z" fill="#F0B51E"/>
    <!-- face details -->
    <circle cx="57" cy="43" r="3" fill="#4A2C00"/>
    <circle cx="78" cy="43" r="3" fill="#4A2C00"/>
    <path d="M61 58 C66 63, 73 63, 78 58" class="thin"/>
    <!-- neck/body -->
    <rect x="58" y="70" width="22" height="18" fill="#FFD76A"/>
    <path d="M20 175 C24 110, 44 84, 68 84 C94 84, 114 112, 118 175Z" fill="#3757C8"/>
    <!-- laptop -->
    <rect x="16" y="96" width="105" height="67" rx="5" fill="#6E737D" filter="url(#softShadow)"/>
    <path d="M16 158 L121 158 L137 178 L0 178 Z" fill="#545963"/>
    <circle cx="68" cy="128" r="8" fill="#F6F6F6" opacity="0.9"/>
    <path d="M68 119 C65 123, 66 127, 69 130 C72 126, 73 123, 70 120Z" fill="#6E737D"/>
  </g>

  <!-- Thought cloud -->
  <g transform="translate(168 85)">
    <circle cx="35" cy="52" r="24" fill="#F7F7F7" stroke="#C9C9C9" stroke-width="2"/>
    <circle cx="62" cy="33" r="28" fill="#F7F7F7" stroke="#C9C9C9" stroke-width="2"/>
    <circle cx="96" cy="43" r="31" fill="#F7F7F7" stroke="#C9C9C9" stroke-width="2"/>
    <circle cx="115" cy="75" r="28" fill="#F7F7F7" stroke="#C9C9C9" stroke-width="2"/>
    <circle cx="73" cy="78" r="34" fill="#F7F7F7" stroke="#C9C9C9" stroke-width="2"/>
    <circle cx="32" cy="94" r="20" fill="#F7F7F7" stroke="#C9C9C9" stroke-width="2"/>
    <text x="73" y="66" text-anchor="middle" class="hand" font-size="26" font-weight="700">LGTM!</text>
  </g>

  <!-- Main arrow from user to prompt -->
  <path d="M300 260 C340 260, 365 260, 400 260" class="line"/>

  <!-- Prompt text -->
  <g transform="translate(420 165)">
    <text x="0" y="0" class="hand prompt">system prompt:</text>
    <text x="0" y="34" class="hand prompt">You are an assistant debugging</text>
    <text x="0" y="68" class="hand prompt">RAG, investigate the retrieved</text>
    <text x="0" y="102" class="hand prompt">results</text>

    <!-- green added prompt -->
    <text x="-28" y="139" class="hand small" fill="#168A2B">+</text>
    <rect x="-2" y="117" width="345" height="36" rx="6" fill="#B9F3C3" stroke="#118A2B" stroke-width="2"/>
    <text x="13" y="142" class="hand small">Remember to respond politely</text>
  </g>

  <!-- Output boxes -->
  <g transform="translate(880 70)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#9BE9A5" stroke="#111" stroke-width="2"/>
    <text x="48" y="61" text-anchor="middle" class="sans" font-size="36">✅</text>
  </g>
  <g transform="translate(880 205)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#9BE9A5" stroke="#111" stroke-width="2"/>
    <text x="48" y="61" text-anchor="middle" class="sans" font-size="36">✅</text>
  </g>
  <g transform="translate(880 340)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#F7B7B7" stroke="#111" stroke-width="2"/>
    <text x="48" y="61" text-anchor="middle" class="sans" font-size="36">🚫</text>
  </g>

  <!-- Arrows to cases -->
  <path d="M730 245 C790 196, 820 132, 870 120" class="line"/>
  <path d="M730 245 C775 245, 818 250, 870 253" class="line"/>
  <path d="M730 245 C780 300, 810 363, 870 388" class="line"/>

  <!-- Bottom title -->
  <text x="550" y="525" text-anchor="middle" class="sans title1">Reality of AI Engineering:</text>
  <text x="550" y="570" text-anchor="middle" class="sans title2">Change a prompt or model, break a use</text>
  <text x="550" y="615" text-anchor="middle" class="sans title2">case. Repeat.</text>
</svg>
